name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build de l'image Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node-api:latest ./app
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node-api:${{ github.sha }} ./app

      - name: Push de l'image Docker
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/node-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/node-api:${{ github.sha }}

      - name: Déploiement sur k3s
        run: |
          sudo k3s kubectl apply -f k8s/
          sudo k3s kubectl rollout restart deployment/node-api
          sudo k3s kubectl rollout status deployment/node-api
